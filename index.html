<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calendário do Advento | Charry</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <main class="advento-page">

        <picture class="advento-picture">

            <!-- MOBILE -->

            <source
                media="(max-width: 900px)"
                srcset="./advento-mob.png"
            >


            <!-- DESKTOP -->

            <img
                class="advento-image"
                src="./advento-desk.png"
                alt="Calendário do Advento Charry"
            >

        </picture>

    </main>


    <script src="./script.js"></script>

</body>

</html>
