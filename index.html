
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#eadbdc">

  <meta name="description"
        content="Calendário do Advento Charry. 24 dias de surpresas especiais.">

  <title>Calendário do Advento | Charry</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pagina-calendario">

    <!-- CALENDÁRIO ORIGINAL -->
    <section class="calendario"
             aria-label="Calendário do Advento Charry">

      <div class="calendario-container"
           id="calendario-container">

        <picture class="calendario-imagens">

          <source
            media="(max-width: 767px)"
            srcset="imagens/mobile.png">

          <img
            src="imagens/desk.png"
            alt="Calendário do Advento Charry, de 1 a 24 de dezembro"
            class="calendario-img"
            id="calendario-img">

        </picture>

        <!-- Botões criados pelo JavaScript -->
        <div id="botoes-calendario"
             class="botoes-calendario"></div>

      </div>

    </section>

  </main>


  <!-- MODAL SURPRESA -->

  <div id="surpresa-modal"
       class="surpresa-modal"
       hidden>

    <div class="surpresa-overlay"
         data-fechar></div>

    <section class="surpresa-painel"
             role="dialog"
             aria-modal="true"
             aria-labelledby="surpresa-titulo"
             aria-describedby="surpresa-instrucao">

      <button class="surpresa-fechar"
              type="button"
              aria-label="Fechar surpresa"
              data-fechar>
        &times;
      </button>

      <div class="surpresa-conteudo">

        <div class="surpresa-topo">
          <span class="surpresa-marca">
            CHARRY
          </span>

          <span class="surpresa-linha"></span>

          <span class="surpresa-colecao">
            ADVENT CALENDAR
          </span>
        </div>

        <p id="surpresa-data"
           class="surpresa-data">
          01 DE DEZEMBRO
        </p>

        <h2 id="surpresa-titulo"
            class="surpresa-titulo">
          UMA SURPRESA PARA VOCÊ
        </h2>

        <p id="surpresa-instrucao"
           class="surpresa-instrucao">
          Toque na caixa para descobrir.
        </p>


        <!-- CAIXA INTERATIVA -->

        <button id="abrir-caixa"
                class="caixa-interativa"
                type="button"
                aria-label="Abrir caixa surpresa">

          <span class="caixa-cenario">

            <span class="caixa-luz"></span>

            <span class="caixa-sombra"></span>

            <span class="caixa-corpo">

              <span class="caixa-fita-vertical"></span>

              <span class="caixa-logo">
                CHARRY
              </span>

            </span>

            <span class="caixa-tampa">
              <span class="caixa-fita-tampa"></span>
            </span>

            <span class="caixa-laco">
              <span class="laco-esquerdo"></span>
              <span class="laco-direito"></span>
              <span class="laco-centro"></span>
            </span>

            <span class="caixa-brilho"></span>

          </span>

        </button>


        <!-- RESULTADO DA SURPRESA -->

        <div id="surpresa-resultado"
             class="surpresa-resultado"
             aria-live="polite"
             hidden>

          <p class="resultado-etiqueta">
            SUA SURPRESA
          </p>

          <h3 id="beneficio-titulo">
            EM BREVE
          </h3>

          <p id="beneficio-descricao">
            Uma surpresa especial está sendo preparada.
          </p>


          <!-- CUPOM OPCIONAL -->

          <div id="beneficio-cupom"
               class="beneficio-cupom"
               hidden>

            <span id="codigo-cupom"></span>

            <button id="copiar-cupom"
                    type="button">
              COPIAR
            </button>

          </div>


          <!-- LINK OPCIONAL -->

          <a id="beneficio-link"
             class="beneficio-link"
             href="#"
             hidden>

            CONFERIR SELEÇÃO

          </a>

        </div>

      </div>

    </section>

  </div>


  <!-- PAINEL DE AJUSTE DOS BOTÕES -->

  <aside id="painel-ajuste"
         class="painel-ajuste"
         hidden>

    <strong>AJUSTAR BOTÕES</strong>

    <p>
      Arraste cada botão para cima
      da casinha correspondente.
    </p>

    <button id="exportar-posicoes"
            type="button">
      COPIAR POSIÇÕES
    </button>

    <button id="restaurar-posicoes"
            type="button">
      RESTAURAR
    </button>

  </aside>


  <script src="script.js"></script>

</body>
</html>
