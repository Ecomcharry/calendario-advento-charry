
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#eadbdc">
  <meta name="description" content="Calendário do Advento Charry. Uma surpresa especial a cada dia de dezembro.">

  <title>Calendário do Advento | Charry</title>

  <link rel="preload" as="image"
        href="imagens/desk.png"
        media="(min-width: 768px)">

  <link rel="preload" as="image"
        href="imagens/mobile.png"
        media="(max-width: 767px)">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pagina-calendario">

    <!-- Espaço reservado para o conteúdo superior -->
    <section class="topo-calendario"></section>

    <!-- Calendário responsivo -->
    <section class="calendario" aria-label="Calendário do Advento Charry">

      <picture class="calendario-imagens">

        <!-- Versão mobile -->
        <source
          media="(max-width: 767px)"
          srcset="imagens/mobile.png"
        >

        <!-- Versão desktop -->
        <img
          id="imagem-calendario"
          class="calendario-img"
          src="imagens/desk.png"
          alt="Calendário do Advento Charry com surpresas de 01 a 24 de dezembro"
          fetchpriority="high"
        >

      </picture>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
