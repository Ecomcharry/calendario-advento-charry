
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#eadbdc">

  <title>Calendário do Advento | Charry</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pagina-calendario">

    <!-- Espaço reservado para conteúdo futuro -->
    <section class="topo-calendario"></section>

    <section
      class="calendario"
      aria-label="Calendário do Advento Charry"
    >

      <div class="calendario-container">

        <!-- Imagens desktop e mobile -->
        <picture class="calendario-imagens">

          <source
            media="(max-width: 767px)"
            srcset="imagens/mobile.png"
          >

          <img
            class="calendario-img"
            src="imagens/desk.png"
            alt="Calendário do Advento Charry"
          >

        </picture>

        <!-- Botões posicionados sobre a imagem -->
        <div
          id="botoes-calendario"
          class="botoes-calendario"
        ></div>

      </div>

    </section>

  </main>

  <!-- Mensagem de dias ainda fechados -->
  <div
    id="aviso"
    class="aviso"
    role="status"
    aria-live="polite"
  ></div>

  <script src="script.js"></script>

</body>
</html>
